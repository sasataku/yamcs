services:
  - class: org.yamcs.archive.XtceTmRecorder
  - class: org.yamcs.archive.ParameterRecorder
  - class: org.yamcs.archive.EventRecorder
  - class: org.yamcs.archive.CommandHistoryRecorder
  - class: org.yamcs.archive.ReplayServer
  - class: org.yamcs.ProcessorCreatorService
    args:
      name: realtime
      type: realtime

mdb:
  - type: xtce
    args:
      file: mdb/cfs.xml
    subLoaders:
      - type: xtce
        args:
          file: mdb/rpu.xml
        subLoaders:
          - type: xtce
            args:
              file: mdb/rpu/cfe_es.xml
          - type: xtce
            args:
              file: mdb/rpu/cfe_evs.xml
          - type: xtce
            args:
              file: mdb/rpu/cfe_sb.xml
          - type: xtce
            args:
              file: mdb/rpu/cfe_tbl.xml
          - type: xtce
            args:
              file: mdb/rpu/cfe_time.xml
          - type: xtce
            args:
              file: mdb/rpu/to_lab.xml
          - type: xtce
            args:
              file: mdb/rpu/ci_lab.xml
      - type: xtce
        args:
          file: mdb/apu.xml
        subLoaders:
          - type: xtce
            args:
              file: mdb/apu/cfe_es.xml
          - type: xtce
            args:
              file: mdb/apu/cfe_evs.xml
          - type: xtce
            args:
              file: mdb/apu/cfe_sb.xml
          - type: xtce
            args:
              file: mdb/apu/cfe_tbl.xml
          - type: xtce
            args:
              file: mdb/apu/cfe_time.xml
          - type: xtce
            args:
              file: mdb/apu/to_lab.xml
          - type: xtce
            args:
              file: mdb/apu/ci_lab.xml

dataLinks:
  - name: to_lab_tm
    class: org.yamcs.tctm.UdpTmDataLink
    stream: tm_realtime
    # to_lab sends to 2234 + processor ID - 1. The APU (processor 1) is
    # relayed from meg2 (10.42.0.1:2234) over Tailscale; the RPU uses 2235.
    port: 2234
    maxLength: 65535
    packetPreprocessorClassName: org.yamcs.tctm.cfs.CfsPacketPreprocessor
    packetPreprocessorArgs:
      byteOrder: BIG_ENDIAN
      # cFE clock initialization and epoch depend on the mission. Until an
      # epoch is configured, timestamp archive data with local reception time.
      useLocalGenerationTime: true
  - name: ci_lab_tc
    class: org.yamcs.tctm.UdpTcDataLink
    stream: tc_realtime
    # meg2 (Tailscale) relays to the APU ci_lab. ci_lab listens on
    # 1234 + processor ID - 1: 1234 for the APU, 1235 for the RPU.
    host: 100.127.121.83
    port: 1234
    commandPostprocessorClassName: org.yamcs.tctm.cfs.CfsCommandPostprocessor
    commandPostprocessorArgs:
      swapChecksumFc: false

streamConfig:
  tm:
    - name: tm_realtime
      processor: realtime
      rootContainer: /cFS/CCSDS_Telemetry
  tc:
    - name: tc_realtime
      processor: realtime
      # The RPU ingests commands and SBN forwards APU MIDs to the APU.
      tcPatterns: ["/cFS/RPU/.*", "/cFS/APU/.*"]
  cmdHist: [cmdhist_realtime]
  event: [events_realtime]
  param: [pp_realtime]
